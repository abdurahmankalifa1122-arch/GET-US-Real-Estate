    <script>
      // GitHub Pages subdirectory trailing slash fix:
      // If deployed to https://<user>.github.io/<repo> without trailing slash,
      // relative assets ./assets/foo.js would resolve to https://<user>.github.io/assets/foo.js (404).
      // Ensure trailing slash so relative paths resolve to the repository folder correctly.
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
